defaultContentLanguage: 'en'
defaultContentLanguageInSubdir: true

timeZone: "UTC"

markup:
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
  goldmark:
    duplicateResourceFiles: true
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    hl_inline: false
    lineAnchors: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    noHl: false
    style: native
    tabWidth: 4
  diagrams:
    enable: true
    theme: default

disableKinds:
- "404"
- home
- robotsTXT
- RSS
#- section
#- sitemap
- taxonomy
- term


enableGitInfo: true

outputs:
  page: [HTML, markdown]
  section: [HTML, markdown]

sitemap:
  filename: "sitemap.xml"
  priority: 0.75

params:
  # The same as in the /products/<APP>/ doc URL prefix
  productCode: delivery-kit
  # GitHub repository link for editing a page and opening issues.
  github_repo: https://github.com/deckhouse/delivery-kit
  # Show "Edit this page" link
  showedit: true

  # Enable Lunr.js offline search
  offlineSearch: true

  # Optional one-sentence summary for /{lang}/documentation/llms.txt (AI agents).
  # Default: "Documentation for <site.Title>."
  # llms:
  #   summary: "..."

  # Global relevant links.
  links:

# See the tdewolff/minify project page for details
minify:
  tdewolff:
    html:
      keepComments: false
      keepDefaultAttrVals: true
      keepDocumentTags: true
      keepEndTags: true
      keepQuotes: true
      keepSpecialComments: true
      keepWhitespace: false
    json:
      keepNumbers: true
      precision: 0
    svg:
      keepComments: false
      precision: 0
    xml:
      keepWhitespace: false

module:
  imports:
    # Site templates
    - path: github.com/deckhouse/hugo-web-product-module

languages:
  en:
    disabled: false
    title: Deckhouse Delivery Kit
    weight: 0
    baseURL: https://deckhouse.io/products/delivery-kit/
    params:
      description: ""
  ru:
    disabled: false
    weight: 1
    title: Deckhouse Delivery Kit
    baseURL: https://deckhouse.ru/products/delivery-kit/
    params:
      description: ""
